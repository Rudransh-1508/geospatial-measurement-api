services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: geomeasure
      POSTGRES_PASSWORD: geomeasure
      POSTGRES_DB: geomeasure
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U geomeasure -d geomeasure"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    build: .
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    environment: &app-env
      DATABASE_URL: postgresql+psycopg://geomeasure:geomeasure@db:5432/geomeasure
      REDIS_URL: redis://redis:6379/0
      UPLOAD_DIR: /data/uploads
    ports:
      - "8000:8000"
    volumes:
      - uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health/')"]
      interval: 3s
      timeout: 3s
      retries: 30

  worker:
    build: .
    command: celery -A app.worker.celery_app worker --loglevel=INFO --concurrency=2
    environment: *app-env
    volumes:
      - uploads:/data/uploads
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
  uploads:
