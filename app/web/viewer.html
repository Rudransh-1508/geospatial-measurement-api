<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Survey Measure</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@125,600;125,800&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/theme.css">
<style>
  html, body { height: 100%; }
  body { display: grid; grid-template-rows: auto auto 1fr; }
  .filehead {
    display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 18px;
    padding: 14px 24px; border-bottom: 1px solid var(--line);
  }
  h1 { font-family: var(--font-display); font-stretch: 125%; font-weight: 600; font-size: 18px; margin: 0; overflow-wrap: anywhere; }
  .meta { color: var(--ink-2); font-size: 13px; display: flex; flex-wrap: wrap; gap: 4px 16px; }
  .meta b { color: var(--ink); font: 500 13px var(--font-mono); }
  .status { display: inline-flex; align-items: center; gap: 6px; font: 500 12px var(--font-mono); }
  .status::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--contour); }
  .status.FAILED { color: var(--bad); } .status.FAILED::before { background: var(--bad); }
  .status.PENDING::before, .status.PROCESSING::before { background: var(--flag); }
  main { display: grid; grid-template-columns: 1fr 360px; min-height: 0; }
  #map { min-height: 0; }
  aside { background: var(--sheet); border-left: 1px solid var(--line); overflow-y: auto; min-height: 0; }
  ul { list-style: none; margin: 0; padding: 0; }
  li { padding: 11px 18px; border-bottom: 1px solid var(--line); cursor: pointer; }
  li:hover, li.active { background: var(--grid); }
  li:focus-visible { outline: 2px solid var(--flag); outline-offset: -2px; }
  li .row { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; }
  li .name { font-weight: 600; overflow-wrap: anywhere; }
  li .value { font: 500 13px var(--font-mono); white-space: nowrap; }
  li .sub { color: var(--ink-3); font-size: 12px; margin-top: 2px; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 7px; vertical-align: 1px; }
  .message { padding: 24px 18px; color: var(--ink-2); cursor: default; }
  .leaflet-container { font-family: var(--font-body); background: var(--grid); }
  .leaflet-popup-content { font: 13px/1.45 var(--font-body); margin: 10px 12px; }
  .leaflet-popup-content table { border-collapse: collapse; }
  .leaflet-popup-content td { padding: 1px 8px 1px 0; vertical-align: top; }
  .leaflet-popup-content td:first-child { color: #5c6660; }
  @media (max-width: 760px) {
    .filehead { padding: 12px 16px; }
    main { grid-template-columns: 1fr; grid-template-rows: 55vh auto; }
    aside { border-left: 0; border-top: 1px solid var(--line); }
  }
</style>
</head>
<body>
<header class="topbar">
  <a class="brand" href="/">Survey Measure</a>
  <nav><a href="/">All files</a><a href="/docs">API docs</a></nav>
</header>
<section class="filehead">
  <h1 id="title">Loading…</h1>
  <span id="status" class="status" hidden></span>
  <div class="meta" id="meta"></div>
</section>
<main>
  <div id="map"></div>
  <aside><ul id="list"><li class="message">Loading features…</li></ul></aside>
</main>
<script src="/static/format.js"></script>
<script>
(() => {
  const { fmtArea, fmtLength, esc } = window.SurveyFormat;
  const fileId = location.pathname.split("/").filter(Boolean).pop();
  const css = getComputedStyle(document.documentElement);
  const colour = (f) => {
    if (f.status === "unsupported") return css.getPropertyValue("--bad").trim();
    if (!f.measurement) return css.getPropertyValue("--point").trim();
    return css.getPropertyValue(f.measurement.kind === "area" ? "--area" : "--length").trim();
  };
  const fmtValue = (m) => m.kind === "area" ? fmtArea(m.value) : fmtLength(m.value);
  // Leaflet joins 179.9 and -179.9 the long way round. Shift a feature's western
  // longitudes by 360 when it spans more than half the globe so it draws where it is.
  function unwrap(geometry) {
    const lons = [];
    const walk = (c, fn) => typeof c[0] === "number" ? fn(c) : c.forEach((x) => walk(x, fn));
    const coords = geometry.type === "GeometryCollection" ? null : geometry.coordinates;
    if (!coords) return geometry;
    walk(coords, (p) => lons.push(p[0]));
    if (Math.max(...lons) - Math.min(...lons) <= 180) return geometry;
    const copy = JSON.parse(JSON.stringify(geometry));
    walk(copy.coordinates, (p) => { if (p[0] < 0) p[0] += 360; });
    return copy;
  }
  const NAME_KEYS = ["Name", "name", "NAME", "title", "label"];
  const label = (f) => {
    const named = NAME_KEYS.find((k) => f.properties[k]);
    if (named) return f.properties[named];
    // Otherwise prefer identifier-like attributes (survey_no, plot_id, code) over any text.
    const entries = Object.entries(f.properties).filter(([, v]) => (typeof v === "string" && v.trim()) || typeof v === "number");
    const idLike = entries.find(([k]) => /(name|title|label|number|code|(^|_)no$|(^|_)id$)/i.test(k));
    const firstText = entries.find(([, v]) => typeof v === "string");
    return String((idLike || firstText || [null, `Feature ${f.id}`])[1]);
  };

  const map = L.map("map", { worldCopyJump: true }).setView([20, 78], 4);
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom: 19, attribution: "&copy; OpenStreetMap contributors",
  }).addTo(map);

  const $ = (id) => document.getElementById(id);
  const showMessage = (text) => { $("list").innerHTML = `<li class="message">${esc(text)}</li>`; };

  function popup(f) {
    const rows = [["Layer", f.layer], ["Type", f.geometry_type], ["CRS", f.crs]];
    if (f.measurement) {
      const m = f.measurement;
      rows.push([m.kind === "area" ? "Area" : "Length", fmtValue(m)]);
      if (m.perimeter != null) rows.push(["Perimeter", fmtLength(m.perimeter)]);
      rows.push(["Geodesic", m.kind === "area" ? fmtArea(m.geodesic_value) : fmtLength(m.geodesic_value)]);
      if (m.relative_difference != null) rows.push(["Rel. diff", m.relative_difference.toExponential(1)]);
      rows.push(["Method", m.method]);
    }
    if (f.reason) rows.push(["Reason", f.reason]);
    if (f.warnings.length) rows.push(["Warnings", f.warnings.join(", ")]);
    for (const [k, v] of Object.entries(f.properties)) rows.push([k, v]);
    return `<strong>${esc(label(f))}</strong><table>${rows.map(([k, v]) => `<tr><td>${esc(k)}</td><td>${esc(v ?? "")}</td></tr>`).join("")}</table>`;
  }

  async function fetchJson(url) {
    const res = await fetch(url);
    const body = await res.json();
    if (!res.ok) throw new Error(body.detail || res.statusText);
    return body;
  }

  async function load() {
    let info;
    try {
      info = await fetchJson(`/api/files/${fileId}/`);
    } catch (e) {
      $("title").textContent = "File not found";
      showMessage(e.message);
      return;
    }
    document.title = `${info.filename} · Survey Measure`;
    $("title").textContent = info.filename;
    $("status").hidden = false;
    $("status").textContent = info.status;
    $("status").className = `status ${info.status}`;

    if (info.status === "PENDING" || info.status === "PROCESSING") {
      showMessage("Processing… this page refreshes automatically.");
      setTimeout(load, 1500);
      return;
    }
    if (info.status === "FAILED") { showMessage(info.error || "Processing failed."); return; }

    const features = [];
    let page;
    let offset = 0;
    do {
      page = await fetchJson(`/api/files/${fileId}/measurements/?limit=1000&offset=${offset}`);
      features.push(...page.features);
      offset += page.pagination.limit;
    } while (offset < page.pagination.total);

    const t = page.totals;
    $("meta").innerHTML = [
      `<span><b>${t.feature_count}</b> features</span>`,
      `<span>CRS <b>${esc(page.crs ?? "unknown")}</b>${page.crs_assumed ? " (assumed)" : ""}</span>`,
      t.area_m2 ? `<span>Total area <b>${fmtArea(t.area_m2)}</b></span>` : "",
      t.length_m ? `<span>Total length <b>${fmtLength(t.length_m)}</b></span>` : "",
    ].join("");

    const list = $("list");
    list.innerHTML = "";
    const bounds = L.latLngBounds([]);
    const items = [];

    for (const f of features) {
      let layer = null;
      if (f.geometry) {
        const c = colour(f);
        layer = L.geoJSON(unwrap(f.geometry), {
          style: { color: c, weight: 2, fillOpacity: 0.2 },
          pointToLayer: (_, latlng) => L.circleMarker(latlng, { radius: 6, color: c, fillOpacity: 0.8 }),
        }).bindPopup(popup(f), { maxWidth: 320 }).addTo(map);
        bounds.extend(layer.getBounds());
      }
      const li = document.createElement("li");
      const value = f.measurement ? fmtValue(f.measurement) : (f.reason || f.status.replace("_", " "));
      li.innerHTML = `<div class="row"><span class="name"><span class="dot" style="background:${colour(f)}"></span>${esc(label(f))}</span><span class="value">${esc(value)}</span></div>`
        + `<div class="sub">${esc(f.geometry_type ?? "No geometry")} · ${esc(f.layer)}${f.warnings.length ? " · " + esc(f.warnings.join(", ")) : ""}</div>`;
      li.tabIndex = 0;
      const focusFeature = () => {
        items.forEach((el) => el.classList.remove("active"));
        li.classList.add("active");
        if (layer) { map.fitBounds(layer.getBounds(), { maxZoom: 17, padding: [40, 40] }); layer.openPopup(); }
      };
      li.addEventListener("click", focusFeature);
      li.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); focusFeature(); } });
      items.push(li);
      list.appendChild(li);
    }
    if (!features.length) showMessage("This file has no features.");
    if (bounds.isValid()) map.fitBounds(bounds, { maxZoom: 17, padding: [30, 30] });
  }

  load().catch((e) => showMessage(e.message));
})();
</script>
</body>
</html>
